version: 2

models:
  - name: mart_cohort_engagement
    description: >
      One row per lender and cohort month. A cohort is the first month
      we sent an email to a mortgage,  not when the mortgage originated.
      This is the main table for comparing how different lenders perform
      across cohorts. Don't use this for mortgage-level work.
    columns:
      - name: lender
        description: Lender name.
        tests:
          - not_null
      - name: cohort_month
        description: Month of the first email sent to this mortgage.
        tests:
          - not_null
      - name: total_mortgages
        description: How many mortgages are in this lender-cohort bucket.
        tests:
          - not_null
      - name: engagement_rate_m1
        description: >
          Share of mortgages where the consumer did something in month 1 —
          clicked, logged in, read something. Excludes the email send itself.
      - name: engagement_rate_m2
        description: Same as m1 but for month 2 after first email.
      - name: engagement_rate_m3
        description: Same as m1 but for month 3 after first email.
      - name: engagement_rate_m1_to_m3
        description: >
          Share of mortgages with any engagement across the first 3 months.
          This is the headline engagement metric.
      - name: intent_rate
        description: >
          Share of mortgages where the consumer declared intent in months 1-3.
          Intent is the strongest signal we have before a mortgage changes state.
      - name: switch_rate
        description: Share of mortgages that ended up switching product.
      - name: redemption_rate
        description: Share of mortgages that were fully repaid or moved to another lender.

  - name: mart_cohort_summary
    description: >
      One row per cohort month, across all lenders combined.
      Useful for spotting trends over time without lender noise getting in the way.
      Please refer to the model mart_cohort_engagement  if you want to compare lenders
    columns:
      - name: cohort_month
        description: Month of first email sent to mortgages in this cohort.
        tests:
          - unique
          - not_null
      - name: total_mortgages
        description: Total mortgages in this cohort across all lenders.
        tests:
          - not_null
      - name: engagement_rate_m1_to_m3
        description: Headline engagement rate for the cohort — any action in months 1-3.
      - name: intent_rate
        description: Share of mortgages with a declared intent event in months 1-3.
      - name: switch_rate
        description: Share of mortgages that switched product.

  - name: mart_mortgage_detail
    description: >
      One row per mortgage. Everything we know about a mortgage in one place —
      which cohort it belongs to, how far through the funnel it got, whether
      it converted (intent), and how long things took.
      Good for segmentation and ad-hoc questions. For cohort reporting
      go to mart_cohort_engagement — don't re-aggregate this table if you
      can avoid it.
    columns:
      - name: mortgage_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: lender
        description: Lender name.
        tests:
          - not_null
      - name: cohort_month
        description: Month of first email sent for this mortgage.
        tests:
          - not_null
      - name: mortgage_state
        description: Where the mortgage ended up — open, switched, or redeemed.
        tests:
          - accepted_values:
              arguments:
                values:
                  - open
                  - switched
                  - redeemed

      - name: engaged_m1_to_m3
        description: >
          1 if the consumer did anything in months 1-3, 0 if not.
          This is the main engagement flag at mortgage level.
      - name: had_intent
        description: >
          1 if the consumer declared intent in months 1-3.
          Strongest behavioural signal before a mortgage changes state.
      - name: funnel_stage_label
        description: >
          Furthest point the consumer reached in months 1-3.
          Goes from no_engagement up through email_clicked, logged_in,
          subtopic_read, start_review, to intent.
      - name: days_to_intent
        description: >
          Days from first email to first intent event. Null if no intent happened.
          Had to resolve this via the applicants table since intent events
          don't carry a mortgage_id directly.
      - name: days_to_close
        description: >
          Days from first email to when the mortgage closed.
          Null for mortgages still open.
      - name: intent_before_close
        description: >
          1 if intent happened before the mortgage closed.
          Useful for checking whether intent is actually predicting outcomes
          or just correlating with them after the fact.